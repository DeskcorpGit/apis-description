name: Auto PR — dev → master

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  open-pr:
    name: Abrir PR automático para master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar commits novos em relação a master
        id: check_diff
        run: |
          git fetch origin master
          COUNT=$(git rev-list --count origin/master..HEAD)
          echo "commits_ahead=$COUNT" >> "$GITHUB_OUTPUT"
          echo "→ Commits à frente de master: $COUNT"

      - name: Garantir labels existentes no repositório
        if: steps.check_diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "auto-pr" --description "PR criado automaticamente pelo CI" --color "0075ca" --force
          gh label create "aguardando-revisão" --description "Aguardando revisão do time de Arquitetura" --color "e4e669" --force

      - name: Criar PR de dev → master
        if: steps.check_diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PR_EXISTS=$(gh pr list --base master --head dev --json number --jq 'length')

          if [ "$PR_EXISTS" -eq "0" ]; then
            echo "Nenhum PR aberto encontrado. Criando um novo PR..."

            PR_TITLE="🚀 [Auto PR] dev → master — $COMMIT_MSG"
            PR_BODY="## Pull Request automático

          Este PR foi gerado automaticamente pelo workflow **auto-pr-to-main** após um push na branch \`dev\`.

          ### Último commit
          - **SHA:** \`$COMMIT_SHA\`
          - **Autor:** $COMMIT_AUTHOR
          - **Mensagem:** $COMMIT_MSG

          ---
          > ⚠️ **Revisão obrigatória pelo time de Arquitetura** conforme definido em \`CODEOWNERS\`.
          > Não faça merge sem ao menos uma aprovação do grupo \`@deskcorp-git/arquitetura\`."

            gh pr create \
              --base master \
              --head dev \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --label "auto-pr,aguardando-revisão" \
              --reviewer "OtavioAraujoS,DeskcorpOtavio"

            echo "✅ PR criado com sucesso!"
          else
            echo "✅ Já existe um PR aberto de dev para master. Ele foi atualizado automaticamente com este push."
          fi

      - name: Sem diferença — PR não necessário
        if: steps.check_diff.outputs.commits_ahead == '0'
        run:
          echo "✅ dev já está sincronizado com master. Nenhum PR necessário."
