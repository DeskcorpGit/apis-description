name: CI — Validação de APIs (Lint & Integridade)

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  validate-specs:
    name: Validar Sintaxe e Regras de Negócio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Validar especificações de APIs (Spectral)
        run: npm run validate:apis

      - name: Verificar Endpoints Duplicados
        run: |
          echo "Analisando duplicidade de rotas (paths) dentro de cada especificação..."

          if [ ! -d "apis/" ]; then
            echo "Pasta apis/ não encontrada. Nenhum endpoint para verificar."
            exit 0
          fi

          FILES=$(find apis/ -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \))
          HAS_DUPLICATES=0

          for file in $FILES; do
            DUPLICATES=$(grep -roE "^  /[a-zA-Z0-9/_{}-]+:" "$file" | sort | uniq -d || true)
            if [ -n "$DUPLICATES" ]; then
              echo "ALERTA: Endpoints duplicados encontrados no arquivo $file:"
              echo "$DUPLICATES"
              HAS_DUPLICATES=1
            fi
          done

          if [ $HAS_DUPLICATES -eq 1 ]; then
            echo "Por favor, unifique as rotas duplicadas dentro do arquivo antes de fazer o merge."
            exit 1
          else
            echo "Nenhum endpoint duplicado encontrado dentro dos arquivos."
          fi
