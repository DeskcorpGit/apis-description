servers:
- url: https://sit.corebanxapp.com.br
- url: https://uat.corebanxapp.com.br
tags:
- name: BeneficiaryServices
  description: Operações do serviço de integração BeneficiaryServices
- name: ClaimsService
  description: Operações do serviço de integração ClaimsService
- name: OpenidAuthService
  description: Operações do serviço de integração OpenidAuthService
- name: PixAuthorization
  description: Operações do serviço de integração PixAuthorization
- name: PixJavaServices
  description: Operações do serviço de integração PixJavaServices
- name: PixServiceFraud
  description: Operações do serviço de integração PixServiceFraud
- name: PixServiceNarrativeFailure
  description: Operações do serviço de integração PixServiceNarrativeFailure
- name: PixServicePix
  description: Operações do serviço de integração PixServicePix
- name: PixServiceQRCode
  description: Operações do serviço de integração PixServiceQRCode
- name: PixServiceRecoveryValues
  description: Operações do serviço de integração PixServiceRecoveryValues
- name: PixServiceReturn
  description: Operações do serviço de integração PixServiceReturn
- name: PixServiceSPI
  description: Operações do serviço de integração PixServiceSPI
- name: PixServiceScheduling
  description: Operações do serviço de integração PixServiceScheduling
- name: PixServices
  description: Operações do serviço de integração PixServices
- name: QrcodeService
  description: Operações do serviço de integração QrcodeService
paths:
  /internal/BeneficiaryServices/addBeneficiary:
    post:
      tags:
      - BeneficiaryServices
      summary: addBeneficiary
      description: 'Serviço de integração `BeneficiaryServices` / operação `addBeneficiary`.


        Tipo de conector: `javaConnector`.


        Implementação interna: `com.basa.integration.service.beneficiary.BasaAddBeneficiaryService.addBeneficiary`.


        Serviço Java interno (sem chamada HTTP externa direta na definição original);
        representado aqui como endpoint sintético.'
      operationId: BeneficiaryServices_addBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                benId:
                  type: string
                  example: '11'
                name:
                  type: string
                  example: test
                cpf:
                  type: string
                  example: test
                favorite:
                  type: string
                  example: 'false'
                ownerAccount:
                  type: string
                  example: '111111'
                accounts:
                  type: array
                profileImg:
                  type: string
              required:
              - benId
              - name
              - cpf
              - favorite
              - ownerAccount
              - accounts
              - profileImg
      responses:
        '200':
          description: Resposta com sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Requisição inválida
        '401':
          description: Não autorizado
        '500':
          description: Erro interno do servidor
