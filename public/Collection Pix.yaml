    (Operations XML) do pacote Pix v1.0, cobrindo os serviços: BeneficiaryServices,
    ClaimsService, OpenidAuthService, PixAuthorization, PixJavaServices, PixServiceFraud,
    PixServiceNarrativeFailure, PixServicePix, PixServiceQRCode, PixServiceRecoveryValues,
    PixServiceReturn, PixServiceSPI, PixServiceScheduling, PixServices, QrcodeService.'
